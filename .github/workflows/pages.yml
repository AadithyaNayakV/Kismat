# Publishes frontend/ to GitHub Pages.
# Runs after every scrape (called from scrape.yml), when website files change, or manually.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy website

on:
  push:
    branches: [main]
    paths: ["frontend/**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # latest commit, including the data just pushed by the scraper

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - uses: actions/deploy-pages@v4
